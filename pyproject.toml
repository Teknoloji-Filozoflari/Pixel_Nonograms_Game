[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-nonograms"
version = "0.1.0"
description = "Offline Nonogram desktop game"
requires-python = ">=3.13"
dependencies = ["PySide6-Essentials>=6.8,<7", "numpy>=2.1,<3", "Pillow>=11,<13"]

[project.scripts]
pixel-nonograms = "pixel_nonograms.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixel_nonograms = ["translations.json", "catalog_expansion.json", "catalog_extended.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
