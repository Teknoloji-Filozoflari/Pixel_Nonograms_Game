name: AppImage clean desktop check

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Linux packages build run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: Pixel-Nonograms-Linux-amd64
          path: packages
      - name: Open actual AppImage without installing DEB
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xvfb libegl1 libgl1 libopengl0 libfontconfig1 libxkbcommon-x11-0
          package=$(find "$PWD/packages" -name '*.AppImage' -print -quit)
          chmod +x "$package"
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen timeout 120s "$package" --smoke-test
          Xvfb :99 -screen 0 1440x1000x24 -ac -nolisten tcp &
          display_pid=$!
          trap 'kill "$display_pid"' EXIT
          sleep 2
          APPIMAGE_EXTRACT_AND_RUN=1 DISPLAY=:99 QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=1 timeout 120s "$package" --smoke-test
